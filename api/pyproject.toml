[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-platform-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13.1",
  "cryptography>=42.0.0",
  "fastapi==0.115.12",
  "httpx==0.27.2",
  "mysql-connector-python>=9.0.0",
  "asyncua>=1.1.5",
  "pydantic-settings>=2.2.1",
  "python-multipart>=0.0.20",
  "PyJWT>=2.8.0",
  "pymysql>=1.1.1",
  "sqlalchemy>=2.0.29",
  "starlette>=0.46,<0.47",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.8",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
